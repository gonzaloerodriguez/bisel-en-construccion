<!DOCTYPE html>
<html class="scroll-smooth" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="
https://cdn.jsdelivr.net/npm/sweetalert2@11.14.4/dist/sweetalert2.all.min.js
"></script>
    <link
      href="
https://cdn.jsdelivr.net/npm/sweetalert2@11.14.4/dist/sweetalert2.min.css
"
      rel="stylesheet"
    />
    <link href="css/global.css" rel="stylesheet" />

    <title>Landing de muestra</title>
  </head>
  <body class="font">
    <header>
      <nav class="bg-white shadow-md fixed top-0 left-0 right-0 z-50 mb-7">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16">
            <div class="mt-2">
              <img class="w-16 h-16" src="/public/img/logo-bisel.png" alt="" />
            </div>
            <div class="flex items-center">
              <div class="hidden sm:ml-6 sm:flex sm:space-x-8"></div>
            </div>
            <div class="hidden sm:ml-6 sm:flex sm:items-center">
              <div
                class="flex cursor-pointer items-center space-x-2 bg-white rounded-full p-1 border-2 rounded-full border-orange-500"
              >
                Iniciar Sesión
              </div>
            </div>
            <div class="-mr-2 flex items-center sm:hidden">
              <button
                type="button"
                class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-orange-500"
                aria-controls="mobile-menu"
                aria-expanded="false"
                id="mobile-menu-button"
              >
                <span class="sr-only">Open main menu</span>
                <svg
                  class="block h-6 w-6"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="sm:hidden hidden" id="mobile-menu">
          <div class="pt-2 pb-3 space-y-1">
            <a
              href="#home"
              class="bg-orange-50 border-orange-500 text-orange-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium"
              data-translate="inicio"
            >
              Inicio
            </a>
            <a
              href="#services"
              class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium"
              data-translate="servicios"
            >
              Servicios
            </a>
            <a
              href="#process-slider"
              class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium"
              data-translate="proceso"
            >
              Proceso
            </a>
            <a
              href="#about"
              class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium"
              data-translate="nosotros"
            >
              Nosotros
            </a>
            <a
              href="#contact"
              class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium"
              data-translate="contacto"
            >
              Contacto
            </a>
          </div>
          <div class="pt-4 pb-3 border-t border-gray-200">
            <div class="flex items-center px-4">
              <div
                class="flex items-center space-x-2 bg-white rounded-full p-1"
              >
                <button
                  class="px-3 py-1 rounded-full bg-white text-gray-700 focus:outline-none"
                  data-lang="es"
                >
                  es
                </button>
                <button
                  class="px-3 py-1 rounded-full text-gray-700 focus:outline-none"
                  data-lang="en"
                >
                  en
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="">
      <div
        id="home"
        class="relative w-full h-[58.563rem] flex flex-col items-center justify-center text-white overflow-hidden"
      >
        <div
          class="absolute inset-0 bg-[url('/public/img/banner.svg')] bg-cover bg-center h-[58.563rem]"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-t from-gray-100 to-transparent h-full"
        ></div>

        <div class="z-10 absolute bottom-96 text-center space-y-10">
          <h1
            data-translate="titleBanner"
            class="text-4xl text-black md:text-5xl font-bold"
          >
            Recetario Digital Bisel - En Construcción
          </h1>

          <a
            data-translate="buttonBanner"
            target="_blank"
            href="https://api.whatsapp.com/send?phone=593960196477&text=%C2%A1Hola%20Bisel!%20Deseo%20solicitar%20informaci%C3%B3n%20acerca%20de%3A%20[especificar%20tema]"
            class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-lg transition duration-300 cursor-pointer"
          >
            Contactanos
          </a>
        </div>
      </div>
    </main>
    <footer class="bg-white w-full pt-16 pb-6 px-4 md:px-12">
      <div class="container mx-auto">
        <div
          class="flex md:flex-row justify-between items-center md:items-start space-y-6 md:space-y-0"
        >
          <div class="flex flex-col space-y-4 w-full">
            <div class="text-xs md:text-base text-gray-500 text-center">
              <p>
                &copy; <span id="currentYear">2024</span>
                <span data-translate="footerRights"
                  >Todos los derechos reservados</span
                >
              </p>
              <p class="mt-2">
                <span data-translate="footerDeveloped">Desarrollado por</span>
                <a
                  href="#"
                  rel="noopener noreferrer"
                  class="text-orange-500 hover:underline text-xs md:text-base ml-1"
                >
                  Foo Talent Group
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script>
      // Update copyright year automatically
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
    <script src="js/navbar.js"></script>
    <script src="js/services.js"></script>
    <script src="js/processSlider.js"></script>
    <script src="js/contactForm.js"></script>
  </body>
</html>
